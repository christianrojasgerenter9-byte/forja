<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORJA Retos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: tarjeta de nivel arriba (XP, racha, semana), pestañas, y una columna de tarjetas. Estética FORJA: obsidiana con degradado naranja a magenta. */
:root{
  color-scheme:dark;
  --bg:#0e0d0f; --surface:#171518; --raise:#221f24; --fg:#f3eeea; --muted:#a79fa6; --line:#302b32;
  --fire:#ff6a1a; --mag:#e0245e; --gold:#ffc247; --good:#3ecf8e; --grad:linear-gradient(90deg,#ff6a1a,#e0245e);
  --font-d:"Anton","Impact",sans-serif; --font-b:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-b);margin:0;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);font-weight:400;letter-spacing:.03em;margin:0;text-transform:uppercase;text-wrap:balance}
h1{font-size:1.9rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.demo{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.hero{background:linear-gradient(135deg,#2a1410,#1d1019 60%,#171518);border-color:#4a2a22}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.lvl{display:flex;gap:14px;align-items:center}
.badge{width:62px;height:62px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font:400 1.9rem var(--font-d);color:#fff;flex:none}
.bar{height:10px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
@media(prefers-reduced-motion:reduce){.bar>i{transition:none}}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--raise);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font:400 1.5rem var(--font-d);font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.day{text-align:center;font-size:.7rem;color:var(--muted)}
.dot{margin:4px auto 0;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.dot.on{background:var(--grad);border-color:transparent;color:#fff}
.dot.rest{border-style:dashed}
.dot.today{border-color:var(--fire)}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit}
nav button,.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem}
nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
select,input[type=number]{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;max-width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
.msg{min-height:1.3em;font-size:.88rem;margin:8px 0 0}
.msg.ok{color:var(--good)}.msg.pr{color:var(--gold);font-weight:700}.msg.err{color:#ff7b7b}
.reto{display:flex;flex-direction:column;gap:8px}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.pro{color:var(--gold);border-color:var(--gold)}
.pill.done{color:var(--good);border-color:var(--good)}
.num{font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-b)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.rank{font:400 1.2rem var(--font-d);width:24px;color:var(--muted)}
.me{background:rgba(255,106,26,.08);border-radius:8px;padding-inline:8px!important}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.medal{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.medal .mbox{width:92px;max-width:100%}
.medal svg{width:100%;height:auto;display:block}
.medal.on .mbox{filter:drop-shadow(0 6px 10px rgba(255,106,26,.28))}
.medal.on.t-oro{border-color:#6a4a12}.medal.on.t-plata{border-color:#4b5262}.medal.on.t-bronce{border-color:#6a3a1c}.medal.on.t-obsidiana{border-color:#6a4a12;background:linear-gradient(160deg,#2a2230,#171518)}
.medal b{display:block;font:400 .98rem var(--font-d);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.medal span{font-size:.74rem;color:var(--muted)}
.medal.off b{color:var(--muted)}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.88rem}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>Retos FORJA</h1>
    <p class="sub">Tu progreso en series, peso y repeticiones, convertido en niveles y metas.</p>
  </header>
  <p class="demo">Prototipo con datos de ejemplo. Los números, amigos y nombres son inventados; registrar una serie aquí no guarda nada en la app real.</p>
  <section class="card hero" id="hero" aria-label="Tu nivel"></section>
  <nav id="tabs" aria-label="Secciones"></nav>
  <main id="main" class="wrap" style="padding:0"></main>
</div>

<script>
(function(){
"use strict";
var NIVELES=[[0,"Hierro"],[300,"Bronce"],[700,"Acero"],[1200,"Titanio"],[1800,"Obsidiana"],[2600,"Espartano"],[3600,"Titán"]];
var EJ=[["press","Press militar con mochila"],["flex","Flexiones lastradas"],["remo","Remo con mochila"],["hom","Laterales con botellas"],["curl","Curl martillo con mochila"],["sent","Sentadilla con mochila"],["abs","Crunch lastrado"]];
var GRUPO={press:"pecho",flex:"pecho",remo:"espalda",hom:"hombro",curl:"brazo",sent:"pierna",abs:"abs"};
var GNOM={pecho:"Pecho",espalda:"Espalda",hombro:"Hombro",brazo:"Brazo",pierna:"Pierna",abs:"Abdomen"};
var UMBRAL=[[30,"oro"],[15,"plata"],[5,"bronce"]];
var hoy=new Date();hoy.setHours(12,0,0,0);
function key(off){var d=new Date(hoy);d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dow(off){var d=new Date(hoy);d.setDate(d.getDate()+off);return d.getDay()} // 0 dom
function esFin(off){var w=dow(off);return w===0||w===6}

/* ---------- datos de ejemplo ---------- */
var S={tab:"retos",xp:1180,sesiones:{},entreno:{},reclamados:{},series:0,prs:0,visible:true,ej:"press",msg:null};
S.sesiones={
  press:[[-33,10,12],[-29,10,14],[-26,12,10],[-22,12,12],[-19,12,14],[-15,14,10],[-12,14,12],[-8,16,10],[-5,16,12],[-2,18,10]],
  flex:[[-32,5,15],[-28,5,18],[-25,5,20],[-21,7,15],[-18,7,17],[-14,7,20],[-11,10,12],[-7,10,14],[-4,10,16],[-1,10,18]],
  sent:[[-31,15,15],[-27,15,18],[-24,18,15],[-20,18,18],[-17,20,15],[-13,20,17],[-10,22,15],[-6,22,17],[-3,25,12],[-1,25,14]],
  remo:[[-30,8,12],[-26,8,14],[-22,10,12],[-18,10,14],[-14,12,12],[-10,12,14],[-6,14,10],[-2,14,12]],
  hom:[[-29,2,15],[-25,2,18],[-21,3,15],[-17,3,18],[-13,4,15],[-9,4,17],[-5,5,15],[-1,5,16]],
  abs:[[-28,0,20],[-23,0,25],[-18,3,15],[-13,3,18],[-8,5,15],[-3,5,18]],
  curl:[[-30,6,12],[-26,6,14],[-23,8,10],[-19,8,12],[-16,8,14],[-12,10,10],[-9,10,12],[-5,10,14],[-2,12,10],[-1,12,11]]
};
var hueco=-13;while(esFin(hueco))hueco--;
for(var i=-34;i<=-1;i++){if(!esFin(i)&&i!==hueco)S.entreno[key(i)]=true}
S.grupos={pecho:14,espalda:11,hombro:8,brazo:12,pierna:17,abs:4};S.hoyG={};
var AMIGOS=[["Amigo de ejemplo 1",1640,11,5],["Amigo de ejemplo 2",1390,6,4],["Amigo de ejemplo 3",980,3,3],["Amigo de ejemplo 4",610,2,2]];

/* ---------- cálculos ---------- */
function nivel(){var n=0;for(var i=0;i<NIVELES.length;i++)if(S.xp>=NIVELES[i][0])n=i;var sig=NIVELES[n+1];return {n:n,nombre:NIVELES[n][1],desde:NIVELES[n][0],hasta:sig?sig[0]:null,sigNombre:sig?sig[1]:null}}
function racha(){var c=0;for(var o=0;o>-60;o--){var k=key(o);if(esFin(o))continue;if(S.entreno[k]){c++}else if(o===0){continue}else break}return c}
function mejor(id){var m=0;S.sesiones[id].forEach(function(s){if(s[1]>m)m=s[1]});return m}
function dias30(){var c=0;for(var o=0;o>-30;o--)if(S.entreno[key(o)])c++;return c}
function reps30(){var t=0;EJ.forEach(function(e){S.sesiones[e[0]].forEach(function(s){if(s[0]>-30)t+=s[2]*3})});return t}
function retos(){
  var press0=S.sesiones.press[0][1],mp=mejor("press");
  return [
    {id:"const",t:"Constancia de 30 días",d:"Entrena 18 días en los últimos 30.",v:dias30(),m:18,u:"días",xp:150},
    {id:"racha",t:"Racha de 10",d:"Entrena 10 días hábiles seguidos.",v:racha(),m:10,u:"días",xp:200},
    {id:"press",t:"Press con mochila +10 kg",d:"Sube 10 kg desde tu primer registro ("+press0+" kg).",v:mp-press0,m:10,u:"kg",xp:250},
    {id:"reps",t:"1,500 repeticiones",d:"Suma repeticiones de todos tus ejercicios en 30 días.",v:reps30(),m:1500,u:"reps",xp:200},
    {id:"esp",t:"Retos espartanos",d:"Golden Six: 3 días de cuerpo completo por semana, 4 semanas.",v:0,m:12,u:"sesiones",xp:500,pro:true}
  ];
}

/* ---------- utilidades DOM ---------- */
function h(tag,p,kids){var e=document.createElement(tag);for(var k in p||{}){if(k==="text")e.textContent=p[k];else if(k==="class")e.className=p[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),p[k]);else if(p[k]!==false&&p[k]!=null)e.setAttribute(k,p[k]===true?"":p[k])}(kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
var NS="http://www.w3.org/2000/svg";
function sv(tag,a,txt){var e=document.createElementNS(NS,tag);for(var k in a||{})e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
function bar(v,m,label){var pct=Math.max(0,Math.min(100,m?v/m*100:0));var b=h("div",{class:"bar",role:"progressbar","aria-label":label,"aria-valuemin":"0","aria-valuemax":String(m),"aria-valuenow":String(Math.max(0,Math.min(v,m)))});var i=h("i");i.style.width=pct+"%";b.appendChild(i);return b}
function fmt(n){return Number(n).toLocaleString("es-MX")}

/* ---------- cabecera ---------- */
function pintarHero(){
  var L=nivel(),r=racha(),hero=document.getElementById("hero");hero.textContent="";
  var falta=L.hasta?L.hasta-S.xp:0;
  hero.appendChild(h("div",{class:"lvl"},[
    h("div",{class:"badge","aria-hidden":"true",text:String(L.n+1)}),
    h("div",{class:"grow"},[
      h("div",{class:"row between"},[h("h2",{text:"Nivel "+(L.n+1)+" · "+L.nombre}),h("span",{class:"num sub",text:fmt(S.xp)+" XP"})]),
      L.hasta?bar(S.xp-L.desde,L.hasta-L.desde,"Avance al siguiente nivel"):bar(1,1,"Nivel máximo"),
      h("p",{class:"sub",text:L.hasta?"Te faltan "+fmt(falta)+" XP para "+L.sigNombre+".":"Llegaste al nivel máximo."})
    ])
  ]));
  hero.appendChild(h("div",{class:"stats"},[
    h("div",{class:"stat"},[h("b",{text:String(r)}),h("span",{text:"Racha (días)"})]),
    h("div",{class:"stat"},[h("b",{text:String(dias30())}),h("span",{text:"Días en 30"})]),
    h("div",{class:"stat"},[h("b",{text:String(S.prs)}),h("span",{text:"Récords hoy"})])
  ]));
  var ini=-((hoy.getDay()+6)%7),nom=["L","M","M","J","V","S","D"],w=h("div",{class:"week","aria-label":"Esta semana"});
  for(var i=0;i<7;i++){
    var o=ini+i,k=key(o),on=S.entreno[k],c="dot"+(on?" on":"")+(esFin(o)&&!on?" rest":"")+(o===0?" today":"");
    w.appendChild(h("div",{class:"day"},[nom[i],h("div",{class:c,text:on?"✓":""})]));
  }
  hero.appendChild(w);
  hero.appendChild(h("p",{class:"sub",style:"margin-top:10px",text:"Sábado y domingo son descanso y no rompen la racha."}));
}

/* ---------- registro de serie ---------- */
function registrar(){
  var id=document.getElementById("f-ej").value,w=Number(document.getElementById("f-w").value),r=Number(document.getElementById("f-r").value);
  if(!(w>=0&&w<=300)||!(r>=1&&r<=100)||!Number.isFinite(w)||!Number.isFinite(r)){S.msg=["err","Peso entre 0 y 300 kg y repeticiones entre 1 y 100."];return pintar()}
  S.ej=id;var prev=mejor(id),pr=w>prev,ganado=10,L0=nivel().n;
  var ses=S.sesiones[id],ult=ses[ses.length-1];
  if(ult&&ult[0]===0){if(w>ult[1]||(w===ult[1]&&r>ult[2])){ult[1]=w;ult[2]=r}}else ses.push([0,w,r]);
  if(!S.entreno[key(0)]){S.entreno[key(0)]=true;ganado+=100}
  S.series++;
  var g=GRUPO[id],tg0=tierG(g),tgTxt="";
  if(!S.hoyG[g]){S.hoyG[g]=true;S.grupos[g]++;var tg1=tierG(g);if(tg1&&tg1!==tg0)tgTxt=" Medalla de "+GNOM[g]+": "+TIER[tg1][3]+"."}
  if(pr){ganado+=50;S.prs++}
  S.xp+=ganado;
  var L1=nivel();
  var t="Serie registrada: "+w+" kg × "+r+". +"+ganado+" XP.";
  if(pr)t="¡Récord personal en "+nombreEj(id)+": "+w+" kg! +"+ganado+" XP.";
  if(L1.n>L0)t+=" Subiste a "+L1.nombre+".";
  S.msg=[pr?"pr":"ok",t+tgTxt];pintar();
}
function tierG(g){var n=S.grupos[g];for(var i=0;i<UMBRAL.length;i++)if(n>=UMBRAL[i][0])return UMBRAL[i][1];return null}
function nombreEj(id){return EJ.filter(function(e){return e[0]===id})[0][1]}

/* ---------- vistas ---------- */
function vistaRetos(){
  var form=h("section",{class:"card"},[
    h("h3",{text:"Registrar una serie"}),
    h("div",{class:"form",style:"margin-top:12px"},[
      h("label",null,["Ejercicio",h("select",{id:"f-ej"},EJ.map(function(e){var o=h("option",{value:e[0],text:e[1]});if(e[0]===S.ej)o.selected=true;return o}))]),
      h("label",null,["Peso (kg)",h("input",{id:"f-w",type:"number",min:"0",max:"300",step:"0.5",inputmode:"decimal",value:"20"})]),
      h("label",null,["Repeticiones",h("input",{id:"f-r",type:"number",min:"1",max:"100",inputmode:"numeric",value:"10"})]),
      h("button",{class:"btn pri",text:"Registrar",onclick:registrar})
    ]),
    h("p",{class:"msg "+(S.msg?S.msg[0]:""),role:"status",text:S.msg?S.msg[1]:"Cada serie da 10 XP. Un récord de peso da 50 XP más."})
  ]);
  var lista=retos().map(function(r){
    var hecho=r.v>=r.m,rec=S.reclamados[r.id];
    var acc=null;
    if(r.pro)acc=h("button",{class:"btn",text:"Disponible en PRO",disabled:true});
    else if(hecho&&!rec)acc=h("button",{class:"btn pri",text:"Reclamar +"+r.xp+" XP",onclick:function(){S.reclamados[r.id]=true;S.xp+=r.xp;S.msg=["ok","Reto cumplido: "+r.t+". +"+r.xp+" XP."];pintar()}});
    return h("article",{class:"card reto"},[
      h("div",{class:"row between"},[h("h3",{text:r.t}),r.pro?h("span",{class:"pill pro",text:"PRO"}):(rec?h("span",{class:"pill done",text:"Cumplido"}):h("span",{class:"pill num",text:"+"+r.xp+" XP"}))]),
      h("p",{class:"sub",text:r.d}),
      bar(r.v,r.m,r.t),
      h("div",{class:"row between"},[h("span",{class:"num sub",text:fmt(Math.max(0,Math.min(r.v,r.m)))+" de "+fmt(r.m)+" "+r.u}),acc])
    ]);
  });
  return h("div",{class:"wrap",style:"padding:0"},[form].concat(lista));
}

function grafica(id){
  var d=S.sesiones[id],W=320,H=190,pl=34,pr=10,pt=26,pb=56;
  var ws=d.map(function(s){return s[1]}),mn=Math.min.apply(null,ws),mx=Math.max.apply(null,ws);
  var lo=Math.max(0,Math.floor(mn*0.85)),hi=Math.ceil(mx*1.1);if(hi===lo)hi=lo+1;
  var mr=Math.max.apply(null,d.map(function(s){return s[2]}));
  var x=function(i){return pl+(d.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(d.length-1))};
  var y=function(v){return pt+(hi-v)/(hi-lo)*(H-pt-pb)};
  var s=sv("svg",{viewBox:"0 0 "+W+" "+H,class:"chart",role:"img","aria-label":"Peso por sesión de "+nombreEj(id)});
  [0,.5,1].forEach(function(f){var v=lo+(hi-lo)*f,yy=y(v);s.appendChild(sv("line",{x1:pl,x2:W-pr,y1:yy,y2:yy,stroke:"#302b32","stroke-width":1}));s.appendChild(sv("text",{x:pl-6,y:yy+4,"text-anchor":"end"},String(Math.round(v))))});
  s.appendChild(sv("text",{x:pl-6,y:10,"text-anchor":"end"},"kg"));
  var pts=d.map(function(q,i){return x(i)+","+y(q[1])}).join(" ");
  s.appendChild(sv("polyline",{points:pts,fill:"none",stroke:"#ff6a1a","stroke-width":2.5,"stroke-linejoin":"round"}));
  var rec=0;
  d.forEach(function(q,i){
    var esPR=q[1]>rec;if(esPR)rec=q[1];
    s.appendChild(sv("circle",{cx:x(i),cy:y(q[1]),r:esPR?5:3.5,fill:esPR?"#ffc247":"#ff6a1a",stroke:"#0e0d0f","stroke-width":1.5}));
    var bh=q[2]/mr*28;
    s.appendChild(sv("rect",{x:x(i)-4,y:H-pb+22+(28-bh),width:8,height:bh,rx:2,fill:"#e0245e",opacity:.85}));
  });
  s.appendChild(sv("text",{x:pl-6,y:H-pb+40,"text-anchor":"end"},"reps"));
  s.appendChild(sv("text",{x:x(0),y:H-pb+14,"text-anchor":"start"},"hace "+Math.abs(d[0][0])+" días"));
  s.appendChild(sv("text",{x:x(d.length-1),y:H-pb+14,"text-anchor":"end"},d[d.length-1][0]===0?"hoy":"hace "+Math.abs(d[d.length-1][0])+" d"));
  return s;
}
function vistaProgreso(){
  var sel=h("select",{id:"p-ej","aria-label":"Ejercicio",onchange:function(e){S.ej=e.target.value;pintar()}},EJ.map(function(e){var o=h("option",{value:e[0],text:e[1]});if(e[0]===S.ej)o.selected=true;return o}));
  var d=S.sesiones[S.ej],u=d[d.length-1],p=d[0];
  var cambio=u[1]-p[1];
  var tabla=d.slice().reverse().slice(0,6).map(function(q){return h("li",null,[h("span",{class:"grow num",text:q[0]===0?"Hoy":"Hace "+Math.abs(q[0])+" días"}),h("b",{class:"num",text:q[1]+" kg × "+q[2]})])});
  return h("div",{class:"wrap",style:"padding:0"},[
    h("section",{class:"card"},[h("div",{class:"row between"},[h("h3",{text:"Mi progreso"}),sel]),
      h("div",{class:"stats"},[
        h("div",{class:"stat"},[h("b",{text:mejor(S.ej)+" kg"}),h("span",{text:"Mejor peso"})]),
